name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  stock-cortex-m-configure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Initialize pinned source dependencies
        run: |
          git submodule update --init external/executorch
          git -C external/executorch submodule update --init \
            backends/xnnpack/third-party/FXdiv \
            third-party/flatbuffers \
            third-party/flatcc \
            third-party/gflags \
            third-party/json

      - name: Verify source integrity
        run: python3 tests/verify_source_pins.py

      - name: Configure from PTE sidecars (cmake/nsx_executorch_sidecar.cmake)
        run: |
          cmake -DWORK="$GITHUB_WORKSPACE/build/sidecar-test" -P tests/sidecar/test_sidecar.cmake
          cmake -S tests/sidecar/link -B build/sidecar-link -G Ninja
          # A heliaAOT module the program calls but the build lacks must fail configure.
          if cmake -S tests/sidecar/link -B build/sidecar-link-missing -G Ninja \
              -DNSX_EXECUTORCH_TEST_MISSING=ON; then
            echo "::error::a missing heliaAOT module was accepted"
            exit 1
          fi

      - name: Configure arm provider (CMSIS-NN) with profiling
        run: cmake -S tests/smoke -B build/configure-smoke-arm -G Ninja

      - name: Configure ns provider (CMSIS-NN) with profiling
        run: cmake -S tests/smoke-ns -B build/configure-smoke-ns -G Ninja

      - name: Install NS ops codegen prerequisites
        run: python3 -m pip install --user pyyaml

      - name: Configure ns provider with NS additional kernels
        run: cmake -S tests/smoke-ns-ops -B build/configure-smoke-ns-ops -G Ninja

      - name: Configure standalone cache overrides
        run: |
          cmake -S tests/smoke-standalone \
            -B build/configure-standalone-arm -G Ninja \
            -DNSX_EXECUTORCH_TEST_PROVIDER=arm
          cmake -S tests/smoke-standalone \
            -B build/configure-standalone-ns -G Ninja \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns

      - name: Install Cortex-M GCC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev

      - name: Materialize pinned provider modules
        run: |
          git clone --quiet --recurse-submodules --branch v0.1.0 --depth 1 \
            https://github.com/AmbiqAI/arm-cmsis-nn.git \
            build/providers/arm-cmsis-nn
          git clone --quiet --branch v7.29.2 --depth 1 \
            https://github.com/AmbiqAI/ns-cmsis-nn.git \
            build/providers/ns-cmsis-nn
          test "$(git -C build/providers/arm-cmsis-nn rev-parse HEAD)" = \
            6d21a6f821fb72541173a6c4d05d83329fa74f7c
          test "$(git -C build/providers/ns-cmsis-nn rev-parse HEAD)" = \
            631726420b04860a5c4236956a3741ff5a96bd7f

      - name: Build Cortex-M kernels with real providers
        run: |
          cmake -S tests/real-provider -B build/real-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=arm \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_PORTABLE_SELECT_OPS_LIST="aten::clamp.out,aten::leaky_relu.out,aten::sub.out"
          cmake --build build/real-arm --target cortex_m_kernels portable_kernels --parallel 2
          cmake -S tests/real-provider -B build/real-ns -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn"
          cmake --build build/real-ns --target cortex_m_kernels --parallel 2

      - name: Build NS additional kernels with real ns provider
        run: |
          cmake -S tests/real-provider -B build/real-ns-ops -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn" \
            -DNSX_EXECUTORCH_ENABLE_NS_OPS=ON
          cmake --build build/real-ns-ops \
            --target cortex_m_ns_kernels cortex_m_ns_ops_lib cortex_m_ops_lib --parallel 2
          # Without select lists (the default) every operator is registered:
          # stock cortex_m_ops_lib is used, no nsx_cortex_m_ops_lib is made,
          # and both registration libraries reference every schema operator.
          if cmake --build build/real-ns-ops --target help | grep -q nsx_cortex_m_ops_lib; then
            echo "::error::default build generated nsx_cortex_m_ops_lib"; exit 1
          fi
          registered() {
            arm-none-eabi-nm -C -u "$(find build/real-ns-ops -name "lib$1.a" | head -n1)" |
              grep -oE 'cortex_m(_ns)?::native::[a-z0-9_]+_out' | sort -u | wc -l | tr -d ' '
          }
          for pair in \
              "cortex_m_ops_lib external/executorch/backends/cortex_m/ops/operators.yaml" \
              "cortex_m_ns_ops_lib ops-ns/operators_ns.yaml"; do
            set -- $pair
            want="$(grep -c '^- func:' "$2")"
            got="$(registered "$1")"
            test "$got" = "$want" || {
              echo "::error::$1 registers $got operators, $2 defines $want"; exit 1; }
          done

      # The release heliaPROFILER links; later steps build against it.
      - name: Fetch ns provider v7.47.0
        run: |
          git clone --quiet --branch v7.47.0 --depth 1 \
            https://github.com/AmbiqAI/ns-cmsis-nn.git \
            build/providers/ns-cmsis-nn-7.47
          test "$(git -C build/providers/ns-cmsis-nn-7.47 rev-parse HEAD)" = \
            9f793bd9343b60e794f915b285bd7b7c4a885abe

      - name: Build the HeliaAotBackend runtime
        run: |
          # nsx_executorch itself needs the Ambiq HAL, which this standalone test does not provide, so
          # compile the backend's two translation units directly.
          cmake -S tests/real-provider -B build/real-ns-haot -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn-7.47" \
            -DNSX_EXECUTORCH_ENABLE_HELIA_AOT=ON
          objects="$(ninja -C build/real-ns-haot -t targets all | grep -oE '[^ :]*src/(helia_aot_backend\.cpp|nsx_helia_aot_registry\.c)\.obj' | sort -u)"
          test "$(echo "$objects" | wc -l)" -eq 2
          ninja -C build/real-ns-haot $objects
          # heliaAOT modules link ns-cmsis-nn: the arm provider must be rejected.
          if cmake -S tests/real-provider -B build/real-arm-haot -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
              -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
              -DNSX_EXECUTORCH_TEST_PROVIDER=arm \
              -DNSX_EXECUTORCH_TEST_MODE=nsx \
              -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
              -DNSX_EXECUTORCH_ENABLE_HELIA_AOT=ON; then
            echo "::error::NSX_EXECUTORCH_ENABLE_HELIA_AOT was accepted with the arm provider"
            exit 1
          fi

      - name: Build with selective operator registration
        run: |
          cmake -S tests/real-provider -B build/real-ns-select -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn-7.47" \
            -DNSX_EXECUTORCH_ENABLE_NS_OPS=ON \
            -DNSX_EXECUTORCH_CORTEX_M_SELECT_OPS_LIST="cortex_m::quantize_per_tensor.out,cortex_m::dequantize_per_tensor.out,cortex_m::quantized_linear.out" \
            -DNSX_EXECUTORCH_NS_SELECT_OPS_LIST="cortex_m_ns::quantized_mean.out"
          cmake --build build/real-ns-select \
            --target nsx_cortex_m_ops_lib cortex_m_ns_ops_lib --parallel 2
          # The registration libraries must reference exactly the selection.
          registered() {
            arm-none-eabi-nm -C -u "$(find build/real-ns-select -name "lib$1.a" | head -n1)" |
              grep -oE 'cortex_m(_ns)?::native::[a-z0-9_]+_out' | sort -u | tr '\n' ' '
          }
          got="$(registered nsx_cortex_m_ops_lib)"
          want="cortex_m::native::dequantize_per_tensor_out cortex_m::native::quantize_per_tensor_out cortex_m::native::quantized_linear_out "
          test "$got" = "$want" || { echo "::error::cortex_m registrations: $got"; exit 1; }
          got="$(registered cortex_m_ns_ops_lib)"
          test "$got" = "cortex_m_ns::native::quantized_mean_out " || {
            echo "::error::cortex_m_ns registrations: $got"; exit 1; }
          # An unknown operator name must fail at configure time.
          if cmake -S tests/real-provider -B build/real-ns-select-typo -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
              -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
              -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
              -DNSX_EXECUTORCH_TEST_MODE=nsx \
              -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
              -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn-7.47" \
              -DNSX_EXECUTORCH_CORTEX_M_SELECT_OPS_LIST="cortex_m::quantised_add.out" \
              > build/select-typo.log 2>&1; then
            echo "::error::misspelled select-ops entry was accepted"
            exit 1
          fi
          # ...for that reason, not for another one.
          tr -s ' \n' ' ' < build/select-typo.log |
            grep -q "names 'cortex_m::quantised_add.out', which .* does not define" || {
              cat build/select-typo.log
              echo "::error::the misspelled select-ops entry failed for another reason"
              exit 1
            }
          # NONE: no registration library for either namespace is linked into nsx_executorch.
          cmake -S tests/real-provider -B build/real-ns-select-none -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/arm-none-eabi-gcc.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn-7.47" \
            -DNSX_EXECUTORCH_ENABLE_NS_OPS=ON \
            -DNSX_EXECUTORCH_CORTEX_M_SELECT_OPS_LIST=NONE \
            -DNSX_EXECUTORCH_NS_SELECT_OPS_LIST=NONE
          (cd build/real-ns-select-none && cmake --graphviz=deps.dot . > /dev/null)
          python3 - build/real-ns-select-none/deps.dot <<'PY'
          import re, sys
          dot = open(sys.argv[1]).read()
          labels = dict(re.findall(r'"(node\d+)" \[ label = "([^"]+)"', dot))
          adapter = {n for n, label in labels.items() if label.startswith("nsx_executorch\\n")}
          linked = {labels[b] for a, b in re.findall(r'"(node\d+)" -> "(node\d+)"', dot) if a in adapter}
          bad = sorted(t for t in linked if t.endswith("ops_lib") or t in ("cortex_m_kernels", "cortex_m_ns_kernels"))
          if not adapter or bad:
              sys.exit(f"::error::NONE still links {bad or 'no nsx_executorch target'}")
          PY

  atfe-cross-build:
    runs-on: ubuntu-24.04
    env:
      ATFE_VERSION: "22.1.0"
    steps:
      - uses: actions/checkout@v7

      - name: Initialize pinned source dependencies
        run: |
          git submodule update --init external/executorch
          git -C external/executorch submodule update --init \
            backends/xnnpack/third-party/FXdiv \
            third-party/flatbuffers \
            third-party/flatcc \
            third-party/gflags \
            third-party/json

      - name: Verify source integrity
        run: python3 tests/verify_source_pins.py

      - name: Cache ATfE toolchain
        id: cache-atfe
        uses: actions/cache@v4
        with:
          path: ~/atfe
          key: atfe-${{ env.ATFE_VERSION }}-linux-x86_64-newlib

      - name: Install ATfE (with newlib overlay)
        if: steps.cache-atfe.outputs.cache-hit != 'true'
        # Same layout as helia-profiler's nix/atfe.nix: the base archive has a
        # single wrapper directory (strip it); the newlib overlay is rooted at
        # the toolchain root (extract in place).
        run: |
          base_url="https://github.com/arm/arm-toolchain/releases/download/release-${ATFE_VERSION}-ATfE"
          mkdir -p "$HOME/atfe"
          curl -fsSL "$base_url/ATfE-${ATFE_VERSION}-Linux-x86_64.tar.xz" \
            | tar -xJ -C "$HOME/atfe" --strip-components=1
          curl -fsSL "$base_url/ATfE-newlib-overlay-${ATFE_VERSION}.tar.xz" \
            | tar -xJ -C "$HOME/atfe"

      - name: Export ATFE_ROOT
        run: |
          echo "ATFE_ROOT=$HOME/atfe" >> "$GITHUB_ENV"
          "$HOME/atfe/bin/clang" --version

      - name: Install NS ops codegen prerequisites
        run: python3 -m pip install --user pyyaml

      - name: Configure fixtures with ATfE
        run: |
          cmake -S tests/smoke -B build/configure-smoke-atfe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/atfe.cmake"
          cmake -S tests/smoke-ns -B build/configure-smoke-ns-atfe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/atfe.cmake"
          cmake -S tests/smoke-ns-ops -B build/configure-smoke-ns-ops-atfe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/atfe.cmake"

      - name: Materialize pinned provider modules
        run: |
          git clone --quiet --recurse-submodules --branch v0.1.0 --depth 1 \
            https://github.com/AmbiqAI/arm-cmsis-nn.git \
            build/providers/arm-cmsis-nn
          git clone --quiet --branch v7.29.2 --depth 1 \
            https://github.com/AmbiqAI/ns-cmsis-nn.git \
            build/providers/ns-cmsis-nn
          test "$(git -C build/providers/arm-cmsis-nn rev-parse HEAD)" = \
            6d21a6f821fb72541173a6c4d05d83329fa74f7c
          test "$(git -C build/providers/ns-cmsis-nn rev-parse HEAD)" = \
            631726420b04860a5c4236956a3741ff5a96bd7f

      - name: Build Cortex-M kernels with real providers (ATfE)
        run: |
          cmake -S tests/real-provider -B build/real-arm-atfe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/atfe.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=arm \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_PORTABLE_SELECT_OPS_LIST="aten::clamp.out,aten::leaky_relu.out,aten::sub.out"
          cmake --build build/real-arm-atfe --target cortex_m_kernels portable_kernels --parallel 2
          cmake -S tests/real-provider -B build/real-ns-atfe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/atfe.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn"
          cmake --build build/real-ns-atfe --target cortex_m_kernels --parallel 2

      - name: Build NS additional kernels with real ns provider (ATfE)
        run: |
          cmake -S tests/real-provider -B build/real-ns-ops-atfe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tests/real-provider/atfe.cmake" \
            -DNSX_EXECUTORCH_TEST_ROOT="$GITHUB_WORKSPACE" \
            -DNSX_EXECUTORCH_TEST_PROVIDER=ns \
            -DNSX_EXECUTORCH_TEST_MODE=nsx \
            -DNSX_EXECUTORCH_TEST_ARM_ROOT="$GITHUB_WORKSPACE/build/providers/arm-cmsis-nn" \
            -DNSX_EXECUTORCH_TEST_NS_ROOT="$GITHUB_WORKSPACE/build/providers/ns-cmsis-nn" \
            -DNSX_EXECUTORCH_ENABLE_NS_OPS=ON
          cmake --build build/real-ns-ops-atfe \
            --target cortex_m_ns_kernels cortex_m_ns_ops_lib --parallel 2

      - name: Verify MVE codegen (no scalar fallback)
        # A regression to integer-only MVE (e.g. an -mfpu flag sneaking back
        # into the board flags) builds green but silently drops the Helium
        # float paths; require vector loads/stores in the archives.
        run: |
          for lib in \
            build/real-arm-atfe/nsx-executorch/executorch/backends/cortex_m/libcortex_m_kernels.a \
            build/real-arm-atfe/arm-cmsis-nn-provider/arm-cmsis-nn-src/libcmsis-nn.a \
            build/real-ns-atfe/ns-cmsis-nn-provider/libnsx_cmsis_nn.a; do
            # Run objdump separately so its failures still fail the step;
            # mask only grep's no-match exit status so a zero count reaches
            # the echo/test below instead of aborting under bash -e.
            disasm="$("$HOME/atfe/bin/llvm-objdump" -d "$lib")"
            count="$(printf '%s' "$disasm" | grep -cE 'vldrw|vldrb|vstrw' || true)"
            echo "$lib: $count MVE vector memory instructions"
            test "$count" -gt 0
          done

  aot-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AOT toolchain
        # executorch 1.3.0 has no PyPI wheel; 1.3.1 is the nearest published
        # release of the pinned v1.3 line. torch is pinned to the 2.12 pairing
        # executorch 1.3.1 was built against. cmsis_nn provides the Python
        # package the stock cortex_m backend imports (pin matches the CMSIS-NN
        # revision vendored by ExecuTorch v1.3).
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          pip install executorch==1.3.1 tosa-tools==2026.2.1 pytest
          # The pinned CMSIS-NN revision's pyproject uses the
          # cmake.minimum-version key, which scikit-build-core >= 0.8 rejects.
          # Its build-system floor is scikit-build-core>=0.7, so build without
          # isolation against a compatible pre-0.8 release.
          pip install "scikit-build-core[pyproject]>=0.7,<0.8" "pybind11>=2.10"
          pip install --no-deps --no-build-isolation \
            "cmsis_nn @ git+https://github.com/ARM-software/CMSIS-NN.git@d933672e7ca97eec70ef43230baee7b20c2a28ae"
          # helia-aot delegate (aot/nsx_cortex_m/helia_aot): heliaAOT itself, and ns-cmsis-nn sources for
          # the host bit-exactness tests of the generated code.
          pip install "helia-aot>=1.5,<2"
          git clone --quiet --branch v7.47.0 --depth 1 \
            https://github.com/AmbiqAI/ns-cmsis-nn.git build/providers/ns-cmsis-nn-7.47

      - name: Run AOT tests
        env:
          NSX_EXECUTORCH_TEST_NS_CMSIS_NN_ROOT: ${{ github.workspace }}/build/providers/ns-cmsis-nn-7.47
        run: python -m pytest aot/tests -q
