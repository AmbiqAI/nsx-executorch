# Ambiq ns-cmsis-nn additional operators.
#
# These schemas live in the dedicated `cortex_m_ns` namespace, never in the
# stock `cortex_m` namespace. PTEs that contain only `cortex_m::` operators run
# on both CMSIS-NN providers; PTEs that contain `cortex_m_ns::` operators fail
# fast at Method load on provider=arm builds because the kernels below are
# only registered when NSX_EXECUTORCH_CMSIS_NN_PROVIDER=ns and
# NSX_EXECUTORCH_ENABLE_NS_OPS=ON.
#
# Structure mirrors the stock backend yaml at
# external/executorch/backends/cortex_m/ops/operators.yaml.

- func: cortex_m_ns::quantized_sub.out(Tensor self, int self_zero_point, int self_multiplier, int self_shift, Tensor other, int other_zero_point, int other_multiplier, int other_shift, int output_zero_point, int output_multiplier, int output_shift, int activation_min, int activation_max, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_sub_out

- func: cortex_m_ns::quantized_hardswish.out(Tensor self, int input_zero_point, int output_zero_point, int output_multiplier, int output_shift, int relu_q3, int relu_q6, int prescale, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_hardswish_out

- func: cortex_m_ns::quantized_mean.out(Tensor self, int input_zero_point, int[] axis_mask, bool keepdim, int output_zero_point, int output_multiplier, int output_shift, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_mean_out

- func: cortex_m_ns::quantized_relu.out(Tensor self, int input_zero_point, int output_zero_point, int output_multiplier, int output_shift, int activation_min, int activation_max, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_relu_out

- func: cortex_m_ns::quantized_leaky_relu.out(Tensor self, int input_zero_point, int output_zero_point, int alpha_multiplier, int alpha_shift, int identity_multiplier, int identity_shift, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_leaky_relu_out

# Stock cortex_m::quantized_conv2d / quantized_depthwise_conv2d with the
# ns-cmsis-nn per-output-channel weight sums precomputed at export time
# (int32 [out_ch]: input_offset * sum(weights of channel j) + bias[j]).
# weight_sum_format versions that layout (kWeightSumFormat in
# op_quantized_conv2d_ws.cpp, WEIGHT_SUM_FORMAT in aot/nsx_cortex_m).
- func: cortex_m_ns::quantized_conv2d_ws.out(Tensor input, Tensor weight, Tensor? bias, int[] stride, int[] padding, int[] dilation, int input_offset, int output_offset, Tensor requantize_multipliers, Tensor requantize_shifts, int activation_min, int activation_max, Tensor weight_sum, int weight_sum_format, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_conv2d_ws_out

- func: cortex_m_ns::quantized_depthwise_conv2d_ws.out(Tensor input, Tensor weight, Tensor? bias, int[] stride, int[] padding, int[] dilation, int depth_multiplier, int input_offset, int output_offset, Tensor requantize_multipliers, Tensor requantize_shifts, int activation_min, int activation_max, Tensor weight_sum, int weight_sum_format, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_depthwise_conv2d_ws_out

# Layer norm over the last dimension (ns-cmsis-nn arm_layer_norm_s8 / _s16): int8 or int16 input and output, with
# gamma / bias / epsilon / output_shift folded at export (aot/nsx_cortex_m/layer_norm_ns.py).
- func: cortex_m_ns::quantized_layer_norm.out(Tensor self, Tensor gamma, Tensor bias, int epsilon, int output_shift, int activation_min, int activation_max, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::quantized_layer_norm_out

# Float32 layer norm over the last dimension (ns-cmsis-nn arm_layer_norm_f32, or plain C without float kernels).
- func: cortex_m_ns::layer_norm.out(Tensor self, Tensor? weight, Tensor? bias, float eps, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: cortex_m_ns::layer_norm_out
